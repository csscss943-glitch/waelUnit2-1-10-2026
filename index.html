itle:"الوحدة 2 الدرس 1: تقنيات التشفير والمصادقة",icon:vr,sections:{performance:{essays:[{q:"اشرح كيف تعمل اتصالات HTTPS على حماية الاتصال، وما دور بروتوكول TLS في ذلك؟",a:"يعتمد HTTPS على نقل بروتوكول HTTP عبر اتصال TLS مؤمن؛ حيث ينفذ الطرفان مصافحة TLS للتحقق من هوية الخادم عبر الشهادات الرقمية والاتفاق على مفاتيح الجلسة، ثم تُشفر بيانات الجلسة لحماية سريتها وسلامتها أثناء النقل ومجابهة التنصت."},{q:"ميز بين دور كل من التشفير المتماثل والتشفير بالمفتاح العام أثناء تدفق اتصال HTTPS؟",a:"يُستخدم التشفير بالمفتاح العام أثناء مصافحة TLS للتحقق من هوية الخادم والاتفاق الآمن على أسرار الجلسة، بينما يُستخدم التشفير المتماثل لحماية بيانات الجلسة المتبادلة بكفاءة وسرعة عالية بعد اكتمال المصافحة لأن تبادل البيانات بالتشفير بالمفتاح العام سيكون بطيئاً."},{q:"ما الدور الأساسي للشهادة الرقمية وآليات المفتاح العام في بدء اتصال TLS آمن؟",a:"تساعد الشهادة الرقمية المتصفح على التحقق من صحة هوية الخادم وارتباط الشهادة باسم النطاق، وتتيح آليات المفتاح العام تبادل الأسرار الآمن بين المتصفح والخادم والتي تُشتق منها مفاتيح الجلسة المشتركة."},{q:"قارن بإيجاز بين وظيفة التوقيع الرقمي ووظيفة الشهادة الرقمية في أنظمة الأمان؟",a:{bullets:[{title:"الشهادة الرقمية",desc:"تُستخدم للتحقق من أن الطرف المقابل في الاتصال (الخادم) حقيقي وارتباطه بالنطاق."},{title:"التوقيع الرقمي",desc:"يُستخدم لاكتشاف التلاعب بالرسائل والبيانات، والتحقق من هوية الموقّع، وتوفير دليل يدعم عدم التنصل."}]}}],mcqs:[{q:"أي من التقنيات التالية يُستخدم أساساً لتشفير بيانات الجلسة بسرعة وكفاءة عالية بعد اكتمال عملية المصافحة واتفاق الأمان؟",options:["أ- التشفير بالمفتاح العام","ب- التشفير المتماثل","ج- التوقيع الرقمي","د- الشهادة الرقمية"],correct:1},{q:"ماذا تسمى الخطوات الخاصة بإنشاء الاتصال الآمن والتحقق من هوية الخادم واسم النطاق عبر بروتوكول HTTPS؟",options:["أ- مصافحة TLS","ب- التوقيع الرقمي","ج- المصادقة الثنائية","د- التشفير المتماثل"],correct:0},{q:"ما هي التقنية التي تساعد المتصفح على التحقق من هوية الخادم وارتباط الشهادة باسم النطاق الذي يتصل به؟",options:["أ- التشفير المتماثل","ب- التوقيع الرقمي","ج- الشهادة الرقمية","د- المصادقة الثنائية"],correct:2},{q:"أي من التقنيات الآتية تكتشف التلاعب وانتحال الشخصية وتوفر دليلاً يدعم عدم التنصل؟",options:["أ- التشفير المتماثل","ب- التوقيع الرقمي","ج- مصافحة TLS","د- المصادقة الثنائية"],correct:1}]},homework:{essays:[{q:"ما المقصود بمصطلح «المصادقة الثنائية (2FA)»، وكيف يقلل استخدام عامل مستقل ثانٍ من مخاطر الدخول غير المصرح به؟",a:"هي استخدام عاملين مستقلين ينتميان لفئتين مختلفين لإثبات الهوية (مثل المعرفة والحيازة)؛ ويقلل الخطر لأنه في حال تسربت كلمة المرور (عامل المعرفة)، فإن الحساب يظل محميًا لأن المهاجم لا يملك العامل الثاني المستقل (مثل الهاتف لتلقي رمز التحقق)."},{q:"اذكر الفروق الأساسية بين المصادقة الثنائية (2FA) والمصادقة متعددة العوامل (MFA) من حيث عدد وفئات العوامل المستخدمة؟",a:"المصادقة الثنائية (2FA) تتطلب استخدام عاملين اثنين فقط من فئتين مختلفين، بينما المصادقة متعددة العوامل (MFA) تشمل استخدام عاملين أو أكثر من فئات المصادقة الثلاث (المعرفة، الحيازة، والسمات الحيوية)."},{q:"اشرح باختصار كيف يتم الجمع بين تقنيات الأمان المختلفة (التشفير، الشهادات، المصادقة الثنائية) عند إتمام عملية شراء عبر متجر إلكتروني؟",a:"تُستخدم الشهادات الرقمية ومصافحة TLS للتحقق من هوية موقع المتجر الموثوق، ثم يُستخدم التشفير لحماية سرية بيانات المشتري وبطاقة الائتمان أثناء النقل، وتُطبق المصادقة الثنائية (مثل رمز OTP الموجه للهاتف) لتأكيد هُوية المشتري ومنع الاحتيال المصرفي."},{q:"لماذا لا يُكتفى بتقنية أمان واحدة فقط لضمان حماية الخدمات والاتصالات عبر الإنترنت، وما هي الفائدة العملية لتعدد الطبقات؟",a:"لأن كل تقنية تعالج تهديداً محدداً ولا توجد تقنية تمنع التهديدات منعاً مطلقاً؛ والفائدة العملية لتعدد الطبقات وتكديس الأمان هي معالجة عدة تهديدات في وقت واحد (كالتنصت والتلاعب وانتحال الهوية والدخول غير المصرح به)."}],mcqs:[{q:"أي من الخيارات التالية يمثل عاملين من فئتين مختلفين تماماً (المعرفة والحيازة) يُستخدمان في المصادقة الثنائية للخدمات المصرفية؟",options:["أ- كلمة مرور + كلمة مرور ثانية نصية","ب- كلمة مرور + كلمة مرور لمرة واحدة (OTP)","ج- بصمة الأصبع + التعرف على الوجه","د- بطاقة هوية ورقية + اسم المستخدم فقط"],correct:1},{q:"ماذا يُقصد بمصطلح المصادقة متعددة العوامل (MFA)؟",options:["أ- استخدام كلمة مرور واحدة طويلة ومعقدة للغاية","ب- استخدام عاملين أو أكثر من فئات مختلفة مثل المعرفة والحيازة والسمات الحيوية","ج- الاعتماد حصراً على بصمة الأصبع فقط","د- استخدام عنوان البريد الإلكتروني مع كلمة المرور التقليدية"],correct:1},{q:"أي من التقنيات التالية تمنع قراءة محتوى الاتصال من قبل أطراف ثالثة أثناء نقل البيانات عبر الشبكة؟",options:["أ- التشفير (بالمفتاح المتماثل والمفتاح العام)","ب- التوقيع الرقمي","ج- المصادقة الثنائية (2FA)","د- الشهادة الرقمية"],correct:0},{q:"من بين الخيارات التالية، أي خيار يُعد مثالاً خاطئاً للمصادقة الثنائية لأنه يعتمد على نفس فئة العامل (المعرفة)؟",options:["أ- كلمة مرور + كلمة مرور لمرة واحدة ترسل للهاتف","ب- كلمة مرور + بصمة الأصبع","ج- كلمة مرور + كلمة مرور سرية ثانية","د- كلمة مرور + رمز من تطبيق مصادقة"],correct:2}]},modelA:{essays:[{q:"اشرح بالتفصيل كيف تستخدم اتصالات HTTPS تقنيات مختلفة لحماية الاتصال منذ لحظة بدء المصافحة وحتى تبادل البيانات؟",a:"تبدأ العملية بمصافحة TLS؛ حيث يرسل الخادم شهادته الرقمية للمتصفح للتحقق من هويته وملاءمته لاسم الموقع، ثم يتفق الطرفان بآليات المفتاح العام على مفاتيح الجلسة، وبعد اكتمال المصافحة تُحمى كافة بيانات الجلسة المتبادلة بالتشفير المتماثل وآليات سلامة البيانات."},{q:"ميز بدقة بين دور التشفير المتماثل والتشفير بالمفتاح العام، موضحاً سبب استخدام كل منهما في مراحل اتصال HTTPS؟",a:"يُستخدم التشفير بالمفتاح العام للمصادقة وللتبادل الآمن لمفاتيح الجلسة أثناء المصافحة المبدئية، بينما يُستخدم التشفير المتماثل لتبادل بيانات الجلسة الفعلية؛ لأن استخدام التشفير بالمفتاح العام لجميع البيانات سيكون بطيئاً جداً وغير كفء."},{q:"وضح بمثال عملي كيف تستخدم المصادقة الثنائية في تسجيل الدخول إلى حسابات وسائل التواصل الاجتماعي أو الخدمات المصرفية؟",a:"عند تسجيل الدخول يدخل المستخدم كلمة المرور (عامل المعرفة)، ثم يطلب النظام إدخال رمز تحقق مؤقت يُرسل في رسالة قصيرة SMS أو عبر تطبيق المصادقة على هاتفه الذكي (عامل الحيازة)، مما يضمن عدم الدخول إلا بامتلاك العاملين معاً."},{q:"ناقش العبارة التالية: «يعتمد الاتصال والخدمات الآمنة عبر الإنترنت على الجمع بين التشفير والمصادقة، وليس على تقنية واحدة فقط.» مبيناً دور كل تقنية مجتمعة؟",a:"تحافظ الخدمات على أمانها بتكديس عدة حمايات؛ حيث يمنع التشفير التنصت وقراءة المحتوى، وتثبت الشهادة الرقمية هوية الخادم، ويضمن التوقيع الرقمي سلامة البيانات وعدم التنصل، وتمنع المصادقة الثنائية الدخول غير المصرح به."}],mcqs:[{q:"بروتوكول HTTP منقول عبر اتصال TLS مؤمن يوفر سرية البيانات وسامتها أثناء النقل يُعرف بـ:",options:["أ- HTTPS","ب- FTP","ج- SMTP","د- DNS"],correct:0},{q:"استخدام عاملين مستقلين من فئتين مختلفين لإثبات الهوية يُعرف بـ:",options:["أ- التشفير المتماثل","ب- المصادقة الثنائية (2FA)","ج- التوقيع الرقمي","د- الشهادة الرقمية"],correct:1},{q:"تقنية تكتشف التلاعب وانتحال الشخصية وتوفر دليلاً يدعم عدم التنصل هي:",options:["أ- التوقيع الرقمي","ب- التشفير بالمفتاح العام","ج- مصافحة TLS","د- الحوسبة السحابية"],correct:0},{q:"أي من الخيارات الآتية يمثل فئات عوامل المصادقة متعددة العوامل (MFA) بدقة؟",options:["أ- المعرفة والحيازة والسمات الحيوية","ب- السرعة والكفاءة والتكلفة","ج- المفتاح العام والمفتاح الخاص وكلمة المرور","د- الاتصال اللاسلكي والشبكة المحلية والسحابة"],correct:0}]},modelB:{essays:[{q:"اشرح الخطوات الأساسية التي تحدث خلال «مصافحة TLS» وكيف يتحقق المتصفح من شهادة الخادم؟",a:"يرسل الخادم شهادته الرقمية للمتصفح، فيتحقق المتصفح من صلاحيتها وملاءمتها لاسم الموقع الموصل، ثم يتفق الطرفان بآليات المفتاح العام على إعدادات الحماية وتُشتق مفاتيح الجلسة لتأمين البيانات."},{q:"وضح لماذا يكون استخدام التشفير بالمفتاح العام لجميع البيانات متبادلة بطيئاً، وكيف يعالج بروتوكول TLS هذه المشكلة باستخدام مفاتيح الجلسة؟",a:'يكون التشفير بالمفتاح العام بطيئاً ومستهلكاً للموارد الحسابية في حجم البيانات الكبير؛ ويعالج بروتوكول TLS ذلك باستخدام التشفير بالمفتاح العام للاتفاق الآمن على "مفتاح جلسة متماثل"، ثم تشفير باقي البيانات بالتشفير المتماثل السريع.'},{q:"قارن بين فئات عوامل المصادقة المختلفة (المعرفة، الحيازة، السمات الحيوية) مع ذكر مثال لكل فئة منها؟",a:{bullets:[{title:"المعرفة",desc:"شيء تعرفه فقط (مثل كلمة المرور أو PIN)."},{title:"الحيازة",desc:"شيء تملكه فقط (مثل الهاتف الذكي لتلقي رمز OTP أو البطاقة الذكية IC)."},{title:"السمات الحيوية",desc:"سمة جثمانية فريدة فيك (مثل بصمة الأصبع أو التعرف على الوجه)."}]}},{q:"اشرح كيف يمنع استخدام عامل ثانٍ مستقل (مثل تطبيق المصادقة أو رمز الرسائل القصيرة) اختراق الحساب حتى لو تسربت كلمة المرور الأساسية؟",a:"لأن كلمة المرور تنتمي لفئة المعرفة بينما تطبيق المصادقة ينتمي لفئة الحيازة؛ فعند تسرب كلمة المرور لا يستطيع المخترق إكمال الدخول بدون حيازة الجهاز الفيزيائي لتلقي الرمز المؤقت."}],mcqs:[{q:"زوج من المفاتيح المرتبطة يتكون من مفتاح عام ومفتاح خاص يُستخدم في التشفير لتأمين الاتصال هو:",options:["أ- التشفير بالمفتاح العام","ب- التشفير المتماثل","ج- الكيوبت الكمومي","د- البت الكلاسيكي"],correct:0},{q:"خدمة أو نظام يساعد المتصفح على التحقق من هوية الخادم ومن مطابقة اسم النطاق للشهادة الرقمية:",options:["أ- التوقيع الرقمي","ب- الشهادة الرقمية","ج- التشفير المتماثل","د- المصادقة الثنائية"],correct:1},{q:"أي من الخيارات التالية يعد مثالاً صحيحاً لعامل «الحيازة» في المصادقة الثنائية؟",options:["أ- معرفة السؤال السرّي","ب- كلمة مرور لمرة واحدة مرسلة للهاتف أو بطاقة ذكية","ج- بصمة الأصبع الخاصة بالمستخدم","د- التعرف على ملامح الوجه"],correct:1},{q:"تركيبات تقنيات الأمان في المتاجر الإلكترونية تضمن حماية التسجيل والدفع من خلال:",options:["أ- الاعتماد على تقنية واحدة فقط لسرعة التنفيذ","ب- الجمع بين التشفير والشهادات والتوقيعات والمصادقة الثنائية لتقليل المخاطر المتعددة","ج- إلغاء استخدام كلمات المرور نهائياً","د- الاكتفاء بالتشفير المتماثل دون أي مصادقة"],correct:1}]},modelC:{essays:[{q:"اشرح بالتفصيل كيف تساهم الشهادات الرقمية وسلسلة الثقة في تمكين المتصفح من التحقق من صحة وملاءمة اسم الموقع الخادم؟",a:"تُصدر جهات تصديق موثوقة الشهادة الرقمية المرتبطة باسم النطاق؛ وعند الاتصال يتأكد المتصفح من تسلسل توقيع الجهة الموثوقة وصلاحية الشهادة ومطابقة اسمها لاسم الموقع المزار لمنع إعادة التوجيه للمواقع المزيفة."},{q:"تكلم باختصار عن التوقيع الرقمي مبيناً خصائصه، وكيف يساعد في اكتشاف التلاعب وانتحال الشخصية وتوفير دليل عدم التنصل؟",a:"التوقيع الرقمي تقنية تشفير تدعم التحقق من سلامة البيانات وهواية الموقّع؛ حيث يكتشف أي تغيير في محتوى الرسالة بعد التوقيع، ويوفر دليلاً يثبت صدور الرسالة من الموقّع المزعوم بحيث لا يمكنه إنكارها (عدم التنصل)."},{q:"ما هي الفوائد الأمنية الناتجة عن جمع عدة تقنيات أمان (التشفير، التوقيعات، الشهادات، المصادقة الثنائية) في سياق الخدمات المصرفية والتسوق الإلكتروني؟",a:"يحقق ذلك منظومة أمان متكاملة؛ حيث يحفظ التشفير سرية البيانات، وتتحقق الشهادة من هوية البنك أو المتجر، ويضمن التوقيع سلامة معاملات الدفع وعدم التلاعب بها، وتمنع المصادقة الثنائية احتيال الحسابات."},{q:"ناقش بحرية لماذا لا تعني وسائل الأمان المتقدمة مثل TLS والمصادقة الثنائية أن الحماية مطلقة أو أن محتوى الموقع موثوق تماماً؟",a:"لأن وسائل الأمان تحمي قناة النقل وتؤكد الهوية، ولكنها لا تضمن خلو الموقع من الهندسة الاجتماعية، أو التصيد الاحتيالي، أو البرمجيات الخبيثة على جهاز المستخدم نفسه؛ فلا توجد تقنية توفر حماية مطلقة بمفردها."}],mcqs:[{q:"خطوات إنشاء الاتصال الآمن والاتفاق على أسرار مشتركة تشتق منها مفاتيح الجلسة تسمى:",options:["أ- مصافحة TLS","ب- التشفير المتماثل","ج- التوقيع الرقمي","د- الشهادة الرقمية"],correct:0},{q:"استخدام عاملين أو أكثر من فئات مختلفة لإثبات الهوية (مثل المعرفة والحيازة والسمات الحيوية) يسمى:",options:["أ- المصادقة متعددة العوامل (MFA)","ب- التشفير بالمفتاح العام","ج- مصافحة TLS","د- التشفير المتماثل"],correct:0},{q:"أي مما يلي يُعد مثالاً على عامل «السمات الحيوية» في المصادقة؟",options:["أ- كلمة المرور النصية","ب- بصمة الأصبع أو التعرف على الوجه","ج- بطاقة الصراف الآلي","د- رمز التحقق عبر الرسائل القصيرة"],correct:1},{q:"الاتصال والخدمات الآمنة عبر الإنترنت تعتمد بشكل أساسي على:",options:["أ- تقنية واحدة فريدة ومطلقة","ب- الجمع بين التشفير والمصادقة والشهادات والتوقيعات الرقمية","ج- استخدام كلمات المرور البسيطة فقط","د- إلغاء استخدام المفاتيح العامة والخاصة"],correct:1}]}}},{id:"l2",title:"تصميم أمان الشبكات",shortTitle:"الوحدة 2 الدرس 2: تصميم أمان الشبكات",icon:gr,sections:{performance:{essays:[{q:"اشرح ما المقصود بمفهوم «الدفاع في العمق» في أمان الشبكات، ولماذا يُعد توفير طبقات متعددة أضمن من الاعتماد على وسيلة حماية واحدة؟",a:"يُقصد بالدفاع في العمق استخدام طبقات متعددة من الضوابط والإجراءات الأمنية؛ وتكمن أهميته في أنه إذا فشلت إحدى طبقات الحماية (مثل جدار الحماية)، تقوم الطبقات الأخرى بالحد من الخطر ومنع كشف الشبكة بأكملها."},{q:"وضح الدور الأساسي لجدار الحماية (Firewall) في أمان الشبكات، واذكر مثالاً على كيفية تحكمه في حركة المرور؟",a:"الدور الأساسي لجدار الحماية هو مراقبة حركة مرور الشبكة والسماح بها أو منعها وفق قواعد أمنية محددة مسبقاً؛ ومثال ذلك: السماح بالوصول الخارجي إلى خادم الويب العام مع منع الوصول الخارجي المباشر إلى قاعدة البيانات الداخلية الحساسة."},{q:"وضح المقصود بـ «المنطقة المعزولة (DMZ)» في تصاميم الشبكات، وكيف تحمي مكونات البنية التحتية الداخلية؟",a:"المنطقة المعزولة هي منطقة تُوضع فيها الخوادم المعرضة للشبكة الخارجية (مثل خوادم الويب والبريد الإلكتروني) بشكل منفصل عن الشبكة الداخلية؛ وتحمي البنية التحتية بتقليل احتمال وصول الهجوم المباشر إلى الشبكة الداخلية في حال تعرض أحد الخوادم العامة للاختراق."},{q:"قارن بإيجاز بين الأمان التقليدي و«نهج انعدام الثقة (Zero Trust)» من حيث التعامل مع مستخدمي الشبكة الداخلية؟",a:'الأمان التقليدي يعتمد على حماية المحيط الأمني بفرضية أن "داخل شبكة المؤسسة آمن، وخارجها خطر"؛ بينما نهج انعدام الثقة لا يمنح الثقة تلقائياً لأي مستخدم أو جهاز لمجرد وجوده داخل الشبكة، بل يفحص الهوية والصلاحيات عند كل طلب وصول.'}],mcqs:[{q:"أي من الخيارات التالية يُعد التعريف الدقيق لمفهوم «الدفاع في العمق» في أمان الشبكات؟",options:["أ- الاعتماد الكامل على جدار حماية قوي عند حدود الشبكة.","ب- استخدام طبقات متعددة من الضوابط الأمنية بحيث تقلل الطبقات الأخرى الخطر إذا فشلت إحدى الطبقات.","ج- منح الثقة التلقائية لجميع الأجهزة الموجودة داخل النطاق الجغرافي للمؤسسة.","د- تشفير حركة المرور بالكامل حصرياً عند استخدام شبكات Wi-Fi العامة."],correct:1},{q:"ما هو المصطلح الذي يطلق على نظام أو برنامج يراقب حركة مرور الشبكة ويسمح بها أو يمنعها وفق قواعد أمنية محددة؟",options:["أ- الشبكة الافتراضية الخاصة","ب- المنطقة المعزولة","ج- جدار الحماية","د- نهج انعدام الثقة"],correct:2},{q:"ماذا يُقصد بمصطلح «المنطقة المعزولة (DMZ)» في هيكلة أمان الشبكات؟",options:["أ- شبكة عامة مفتوحة بالكامل تتيح للمخترقين الوصول إلى قواعد البيانات الحساسة.","ب- منطقة توضع فيها الخوادم المعرضة للشبكة الخارجية بشكل منفصل عن الشبكة الداخلية للمؤسسة.","ج- برمجية خبيثة تقوم بمراقبة حركة المرور وتعديل قواعد جدار الحماية تلقائياً.","د- خط خاص افتراضي مشفر يربط بين الفروع المختلفة عبر الإنترنت العام."],correct:1},{q:"ما هي الفرضية الأساسية التي يعتمد عليها «نهج انعدام الثقة (Zero Trust)» في تأمين موارد المؤسسة؟",options:["أ- اعتبار كل جهاز أو مستخدم داخل شبكة المؤسسة موثوقاً تماماً بشكل تلقائي.","ب- عدم منح الثقة تلقائياً لمستخدم أو جهاز لمجرد وجوده داخل الشبكة أو ملكيته للمؤسسة وفحص الهوية والسياق.","ج- الاعتماد المطلق على المحيط الأمني الخارجي وعدم فحص التطبيقات الداخلية.","د- تشفير رسائل البريد الإلكتروني فقط دون الاهتمام بصلاحيات الوصول للبيانات."],correct:1}]},homework:{essays:[{q:"ما المقصود بمصطلح «الشبكة الافتراضية الخاصة (VPN)»؟ اذكر اثنين من استخداماتها الرئيسية؟",a:"هي اتصال أو شبكة منطقية خاصة تُنشأ عبر شبكة عامة مثل الإنترنت وتستخدم التشفير وتقنيات النفق لحماية البيانات؛ ومن استخداماتها: 1. العمل عن بُعد للاتصال بأمان بشبكة المؤسسة من المنزل. 2. ربط مكاتب وفروع المؤسسة في مواقع مختلفة بأمان."},{q:"لماذا يكون وضع خادم ويب عام في «المنطقة المعزولة (DMZ)» أكثر أماناً من وضعه مباشرة داخل الشبكة الداخلية للمؤسسة؟",a:"لأن وضع خادم الويب العام في DMZ يفصله عن الشبكة الداخلية الحاوية للبيانات السرية؛ فإذا تم اختراق خادم الويب لا يتمكن المهاجم من الوصول المباشر لقواعد البيانات الحساسة داخل المؤسسة."},{q:"اشرح كيف تغيرت الفرضيات الأمنية حول «المحيط الأمني» التقليدي في ظل انتشار الحوسبة السحابية والعمل عن بعد؟",a:'أصبح الاعتماد على المحيط الأمني التقليدي (الذي يفترض أن الداخل آمن والخرج خطر) غير كافٍ، لأن الخدمات السحابية والعمل عن بُعد طمست الحدود بين "الداخل" و"الخارج"، مما استدعى تطبيق نهج انعدام الثقة.'},{q:"اذكر أمثلة على الإجراءات الأمنية الأربعة المرتبطة بطبقات الدفاع في العمق (مدخل الشبكة، مسار الاتصال، وضع الخوادم، الأجهزة الطرفية)؟",a:{bullets:[{title:"مدخل الشبكة",desc:"جدار الحماية لمنع الاتصالات غير المصرح بها."},{title:"مسار الاتصال",desc:"الشبكة الافتراضية الخاصة (VPN) لتشفير الاتصال."},{title:"وضع الخوادم",desc:"المنطقة المعزولة (DMZ) لفصل الخوادم العامة."},{title:"الأجهزة الطرفية",desc:"تثبيت مكافح الفيروسات وتحديث نظام التشغيل."}]}}],mcqs:[{q:"ما هو المصطلح الذي يشير إلى اتصال أو شبكة منطقية خاصة تُنشأ عبر شبكة عامة مثل الإنترنت وتستخدم التشفير لحماية البيانات؟",options:["أ- جدار الحماية","ب- الشبكة الافتراضية الخاصة (VPN)","ج- المنطقة المعزولة (DMZ)","د- نهج انعدام الثقة"],correct:1},{q:"أي من الخيارات الآتية يمثل الاستخدام الأنسب والأكثر شيوعاً للشبكة الافتراضية الخاصة (VPN) في بيئات العمل الحديثة؟",options:["أ- الاتصال بأمان بشبكة المؤسسة من المنزل أو أثناء التنقل والعمل عن بعد.","ب- حماية الأجهزة الطرفية من الفيروسات وإزالتها تلقائياً بدون برامج مساعدة.","ج- مراقبة حركة مرور الشبكة المحلية ومنع البريد الإلكتروني العشوائي.","د- توفير منصات تتيح للمستخدمين نشر المحتوى ومشاركته بسرعة فائقة."],correct:0},{q:"ما هو المفهوم الذي يصف الحدود التقليدية التي تفترض أن ما بداخل شبكة المؤسسة آمن تماماً وما خارجها غير آمن والتي طمستها الخدمات السحابية والعمل عن بعد؟",options:["أ- المنطقة المعزولة","ب- المحيط الأمني","ج- الحوسبة الطرفية","د- التراكب الكمي"],correct:1},{q:"أي من طبقات «الدفاع في العمق» التالية ترتبط ارتباطاً مباشراً بتثبيت برامج مكافحة الفيروسات وتحديث نظام التشغيل؟",options:["أ- مدخل الشبكة","ب- مسار الاتصال","ج- وضع الخوادم","د- الأجهزة الطرفية"],correct:3}]},modelA:{essays:[{q:"اشرح بالتفصيل كيف يعمل «الدفاع في العمق» على حماية المؤسسة بشكل أفضل من الاعتماد على وسيلة حماية واحدة، مستعيناً بما يحدث عند اختراق أحد الدفاعات؟",a:"يعمل الدفاع في العمق بتكديس عدة طبقات دفاعية متتالية؛ فإذا نجح المهاجم في اختراق جدار الحماية (مدخل الشبكة)، تجد الهجمة طبقة المنطقة المعزولة (DMZ) تمنع الوصول للشبكة الداخلية، وتجد البيانات مشفرة بواسطة VPN، بينما تحمي برامج مكافحة الفيروسات الأجهزة الطرفية."},{q:"وضح الدور التقني لـ «جدار الحماية» في مراقبة حركة مرور الشبكة، ومثّل على ذلك بحماية قواعد البيانات؟",a:"يراقب حركة الشبكة عند نقطة الدخول والخروج ويسمح أو يمنع الحزم وفق قواعد برمجية محددة؛ ومثال حماية قواعد البيانات: ضبط الجدار لسمح للعملاء الخارج
